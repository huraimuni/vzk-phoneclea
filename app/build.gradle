plugins {
    id 'com.android.application'
}

// google-services.json 이 있을 때만 Firebase 설정을 적용한다(없어도 빌드는 되지만 로그인은 동작하지 않음)
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'kr.todanjeon.phoneclean'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.todanjeon.phoneclean'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.10'
        buildConfigField 'String', 'NAVER_CLIENT_ID', '"' + (System.getenv('NAVER_CLIENT_ID') ?: '') + '"'
        buildConfigField 'String', 'NAVER_CLIENT_SECRET', '"' + (System.getenv('NAVER_CLIENT_SECRET') ?: '') + '"'
        buildConfigField 'String', 'UPDATE_BRANCH', '"v2-dev"'
        buildConfigField 'String', 'UPDATE_URL', '"https://github.com/huraimuni/vzk-phoneclea/releases/tag/v1.0"'
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.kakao.sdk:v2-user:2.20.6'
    implementation 'com.navercorp.nid:oauth:5.10.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    implementation 'com.android.billingclient:billing:7.1.1'
}
