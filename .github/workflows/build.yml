name: Build Store (AAB)

permissions:
  contents: write

on:
  push:
    branches: [store]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key (only if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signing=on"
          else
            echo "signing=off (unsigned AAB)"
          fi
      - name: Build AAB (store) and test APK
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle bundleRelease assembleRelease --no-daemon
          else
            gradle bundleRelease assembleDebug --no-daemon
          fi
      - name: Collect
        run: |
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab out/VZK_PhoneClean_store.aab
          if [ -n "$KEYSTORE_FILE" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/VZK_PhoneClean_store_test.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/VZK_PhoneClean_store_test.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VZK-PhoneClean-store
          path: out/*
      - name: Publish store test APK (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: VZK 폰클린 스토어 버전 테스트
          body: |
            스토어 제출용 버전의 테스트 APK입니다. (민감 권한 기능을 뺀 버전)
            정식 스토어 파일(AAB)은 Actions 결과물에서 받습니다.
          files: out/VZK_PhoneClean_store_test.apk
