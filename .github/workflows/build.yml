name: Build Store (AAB)

on:
  push:
    branches: [store]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key (only if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signing=on"
          else
            echo "signing=off (unsigned AAB)"
          fi
      - name: Build AAB (store) and test APK
        run: gradle bundleRelease assembleDebug --no-daemon
      - name: Collect
        run: |
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab out/VZK_PhoneClean_store.aab
          cp app/build/outputs/apk/debug/app-debug.apk out/VZK_PhoneClean_store_test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VZK-PhoneClean-store
          path: out/*
