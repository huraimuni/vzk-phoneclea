name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key (only if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signing=on (fixed key, updates install over old versions)"
          else
            echo "signing=off (temporary debug key, updates need uninstall first)"
          fi
      - name: Build APK
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk VZK_PhoneClean_v1.0.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk VZK_PhoneClean_v1.0.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VZK-PhoneClean-APK
          path: VZK_PhoneClean_v1.0.apk
      - name: Publish release v1.0
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          target_commitish: ${{ github.sha }}
          files: VZK_PhoneClean_v1.0.apk
          name: VZK 폰클린 v1.0
          body: |
            VZK 폰클린 - 광고로 깔린 의심 앱 점검·일시 중지·삭제 도우미
            APK를 받아 설치할 때 "출처를 알 수 없는 앱" 허용 안내가 뜰 수 있습니다.
            문의: https://cafe.naver.com/vzk (카페 게시판)
